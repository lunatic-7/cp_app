[package]
name = "cp-roadmap"
version = "1.0.2"
description = "NeetCode 250 roadmap and Codeforces dashboard"
authors = ["Wasif"]
edition = "2021"

[lib]
name = "cp_roadmap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
